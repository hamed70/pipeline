<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد مدیریتی پروژه کرانه شمالی</title>
    
    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>
    
    <!-- ✅ عنوان داشبورد -->
    <div id="dashboardHeader" class="dashboard-header">
        <div class="header-content">
            <div class="header-icon">️</div>
            <div class="header-text">
                <h1>داشبورد مدیریتی پروژه کرانه شمالی</h1>
                
            </div>
            <div class="header-badge">
                <span class="badge-dot"></span>
                آنلاین
            </div>
        </div>
    </div>
    
    <!-- پنل لایه‌ها -->
    <div id="layerPanel" class="glass-panel">
        <div class="panel-header">
            <h3>🗂️ لایه‌ها</h3>
            <button class="toggle-btn" id="toggleLayerPanel">−</button>
        </div>
        <div class="panel-content">
            <label class="layer-item">
                <input type="checkbox" id="lyr-masir" checked>
                <span class="dot color-masir"></span>
                مسیر ۵ متری پیشنهادی
            </label>
            <label class="layer-item">
                <input type="checkbox" id="lyr-harim-20" checked>
                <span class="dot color-harim20"></span>
                حریم ۲۰ متری
            </label>
            <label class="layer-item">
                <input type="checkbox" id="lyr-harim-200" checked>
                <span class="dot color-harim200"></span>
                حریم ۲۰۰ متری
            </label>
            <label class="layer-item">
                <input type="checkbox" id="lyr-harim-7" checked>
                <span class="dot color-harim7"></span>
                حریم ۷ متری
            </label>
        </div>
    </div>

    <!-- پنل ابزارها -->
    <div id="toolbar" class="glass-panel">
        <div class="panel-header">
            <h2>📍 ابزارها</h2>
            <button class="toggle-btn" id="toggleToolbar">−</button>
        </div>
        <div class="panel-content">
            <button id="btnReset" class="btn-primary">🔄 بازنشانی نما</button>
            <button id="btnAnimate" class="btn-primary">🎬 پرواز روی مسیر</button>
            
            <div id="speedControls">
                <label>⚡ سرعت:</label>
                <div class="speed-buttons">
                    <button class="speed-btn" data-speed="0.5">0.5x</button>
                    <button class="speed-btn active" data-speed="1">1x</button>
                    <button class="speed-btn" data-speed="2">2x</button>
                </div>
            </div>
        </div>
    </div>

    <!-- پاپ‌آپ -->
    <div id="customPopup" class="custom-popup"></div>

    <script src="js/map.js"></script>
    <script src="js/layers.js"></script>
    <script src="js/popup.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
